name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        shell: pwsh
        run: .\build_release.ps1
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath "dist/Station Max Studio v2.1.3.exe" `
            -DestinationPath "dist/Station-Max-Studio-2.1.3-Windows-x64.zip" `
            -CompressionLevel Optimal
      - name: Update release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.1.3 `
            "dist/Station-Max-Studio-2.1.3-Windows-x64.zip" `
            --clobber
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Station-Max-Studio-Windows-x64
          path: dist/Station Max Studio v2.1.3.exe
